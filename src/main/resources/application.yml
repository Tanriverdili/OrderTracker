spring:
  datasource:
    url: jdbc:postgresql://ordertracker-db:5432/orderdb
    username: postgres
    password: 2025
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081